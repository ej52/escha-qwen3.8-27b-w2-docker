# docker-compose.tp2-fp8.yml — TP=2 131k with fp8 KV-cache for 2x RTX 3090 (48 GB total, Ampere sm_86)
# Per INSTALL.md §§ "By compute capability" + "By VRAM" (§ fp8 buys context) + REPRO.md tp-fix; verified on 1.2.0+qwen3dense
# Usage:
#   docker compose -f docker-compose.tp2-fp8.yml up --build
# Test:
#   curl http://localhost:8080/v1/models
#   curl http://localhost:8080/v1/chat/completions -H "Content-Type: application/json" -d '{"model":"Qwen3.8-27B-Escha-W2","messages":[{"role":"user","content":"Write a merge sort in Python."}],"max_tokens":512}'

services:
  escha-sglang:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escha-sglang-server-tp2-fp8
    restart: unless-stopped
    ipc: host
    # TP=2 + fp8 KV-cache (32 KiB/token vs 64 KiB fp16 → 2x pool). Passed to serve.sh which forwards to launch_server.
    command: ["bash", "serve.sh", "--tp-size", "2", "--kv-cache-dtype", "fp8_e5m2"]
    environment:
      - HOST=0.0.0.0
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL=/models/Qwen3.8-27B-Escha-W2
      - SERVED_NAME=Qwen3.8-27B-Escha-W2

      # Ampere sm_86 auto-selects lovelace, but blackwell is 1.72x faster at batch 1 (23.6→40.7 tok/s)
      # per INSTALL.md §"By compute capability" — bit-identical, set for single-user; parity at batch 2-16.
      - ESCHA_ROUTE=blackwell
      # Blackwell consumer (sm_120: 5090/5060) requires ATTN_BACKEND=triton; leave empty on Ampere/Ada/Hopper.
      - ATTN_BACKEND=${ATTN_BACKEND:-}

      # Long-Context TP=2 + fp8 profile: 131k per request, 4 concurrent streams on 2x 24 GB
      # Per INSTALL.md §"By VRAM": fp16 = 64 KiB/token, fp8 = 32 KiB/token → 2x max_total_num_tokens.
      # Single-GPU fp16: MEM=0.88 CTXLEN=131072 → pool 141k. TP=2 fp16 → ~282k. TP=2 fp8 → ~564k.
      # Hence 4x131k (=524k) fits with headroom in fp8. For single-stream keep MAXREQ=1/MAXMAMBA=2.
      # Warning: fp8 is lossy, unevaluated for quality per INSTALL.md — "spend MEM before precision on 24GB+".
      - MEM=0.88
      - CTXLEN=131072
      - MAXREQ=4
      - MAXMAMBA=8
      - CHUNK=2048
      - CUDA_GRAPH_BS=1 2 4 8 12 16
      # INT8 lm_head: auto=ON at <=24 GB per GPU (saves ~1.2 GB + decode BW). For TP=2 each rank is 24 GB,
      # so auto remains ON. Force INT8=on for single-user latency, INT8=off for pure batched on >24 GB.
      - INT8=on
      # Optional: keep defaults for THINK=1, RADIX=0 (overlap scheduler), GRAPHS=1, MAMBA_RATIO=0.3,
      # TRUNCATE=1, JSON_WS=1 from serve.sh. For Blackwell stability leave DETERMINISTIC=0.
    volumes:
      - ./models:/models
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8080:30000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
