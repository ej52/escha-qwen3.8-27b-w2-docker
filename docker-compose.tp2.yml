# docker-compose.tp2.yml — TP=2 131k Long-Context profile for 2x RTX 3090 (48 GB total, Ampere sm_86)
# Per INSTALL.md §§ "By compute capability" + "By VRAM" + REPRO.md tp-fix; verified on 1.2.0+qwen3dense
# Usage:
#   docker compose -f docker-compose.tp2.yml up --build
#   # or override: docker compose -f docker-compose.tp2.yml up --build -d
# Test:
#   curl http://localhost:8080/v1/models
#   curl http://localhost:8080/v1/chat/completions -H "Content-Type: application/json" -d '{"model":"Qwen3.8-27B-Escha-W2","messages":[{"role":"user","content":"Write a merge sort in Python."}],"max_tokens":512}'

services:
  escha-sglang:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escha-sglang-server-tp2
    restart: unless-stopped
    ipc: host
    # TP=2 requires the server to see 2 GPUs; pass through extra args via command
    command: ["bash", "serve.sh", "--tp-size", "2"]
    environment:
      - HOST=0.0.0.0
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL=/models/Qwen3.8-27B-Escha-W2
      - SERVED_NAME=Qwen3.8-27B-Escha-W2

      # Ampere sm_86 auto-selects lovelace, but blackwell is 1.72x faster at batch 1 (23.6→40.7 tok/s)
      # per INSTALL.md §"By compute capability" — bit-identical, set for single-user; parity at batch 2-16.
      - ESCHA_ROUTE=blackwell
      # Blackwell consumer (sm_120: 5090/5060) requires ATTN_BACKEND=triton; leave empty on Ampere/Ada/Hopper.
      - ATTN_BACKEND=${ATTN_BACKEND:-}

      # Long-Context TP=2 profile: 131k per request on 2x 24 GB
      # Per INSTALL.md §"By VRAM" 24 GB long-context row (single-GPU): MEM=0.88 CTXLEN=131072
      # MAXREQ=1 MAXMAMBA=2 CHUNK=2048 INT8=on → pool 141k, peak 21.8 GB.
      # On TP=2 each rank holds ~6 GB shards, pool ~2x, so 131k fits with headroom.
      # Use MAXREQ=2/MAXMAMBA=4 for 2 concurrent 131k streams; keep 1/2 for single-stream max headroom.
      - MEM=0.88
      - CTXLEN=131072
      - MAXREQ=1
      - MAXMAMBA=2
      - CHUNK=2048
      - CUDA_GRAPH_BS=1 2 4 8 12 16
      # INT8 lm_head: auto=ON at <=24 GB per GPU (saves ~1.2 GB + decode BW). For TP=2 each rank is 24 GB,
      # so auto remains ON. Force INT8=on for single-user latency, INT8=off for pure batched on >24 GB.
      - INT8=on
      # Optional: keep defaults for THINK=1, RADIX=0 (overlap scheduler), GRAPHS=1, MAMBA_RATIO=0.3,
      # TRUNCATE=1, JSON_WS=1 from serve.sh. For Blackwell stability leave DETERMINISTIC=0.
    volumes:
      - ./models:/models
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8080:30000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
